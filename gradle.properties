pluginGroup=com.dertoo.jsonmock
pluginVersion=1.0.0

# Plataforma contra la que se compila/ejecuta (runIde).
# Si platformLocalPath está definido se usa esa instalación local; si no, se descarga Android Studio.
platformLocalPath=/Applications/Android Studio.app
platformVersion=2025.1.1.13

# IntelliJ IDEA local para ./gradlew runIntelliJ y verifyPlugin.
intellijLocalPath=/Applications/IntelliJ IDEA.app

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true

# Notas de la versión mostradas en el Marketplace (HTML permitido).
pluginChangeNotes=<ul><li>First release: selective JSON mocks with passthrough to the real backend.</li></ul>
